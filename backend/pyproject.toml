[project]
name = "backend"
version = "0.1.0"
description = "Transcription and fluency analysis for IELTS speaking recordings"
authors = [
    { name = "Jenish Adhikari", email = "adhicary.jen@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "uvicorn[standard]>=0.53.0",
    "whisperx>=3.8.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
constraint-dependencies = ["onnxruntime==1.23.2; python_version == '3.10'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
